version: '3.8'

services:
  proxmox-pulse:
    image: cuicuiv5google/proxmox-pulse:latest
    container_name: proxmox-pulse
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - NODE_ENV=production
      - SERVE_STATIC=true
      - PVE_HOST=${PVE_HOST:-192.168.2.5}
      - PVE_PORT=${PVE_PORT:-8006}
      - PVE_TOKEN_ID=${PVE_TOKEN_ID:-root@pam!dashboard}
      - PVE_TOKEN_SECRET=${PVE_TOKEN_SECRET:-}
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-false}
